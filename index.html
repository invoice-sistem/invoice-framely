<html lang="en">
<head>
<meta charset="utf-8">

<title>Framely</title>
<style>

.logo{font:italic 700 26px Georgia,serif;background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
.app{max-width:1000px;margin:0 auto;display:grid}

@media(min-width:800px){.app{grid-template-columns:200px 1fr}header.top{grid-column:1/-1}nav{position:sticky;top:60px;align-self:start;flex-direction:column;height:max-content;background:none;border:0;padding:20px 8px}nav button{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px}nav button span{display:inline;font-size:16px}main{padding-bottom:40px}}
.row{display:flex;gap:8px}.btn{background:var(--ac);color:#3B2418;border-radius:9px;padding:8px 16px;font-weight:600}.btn.alt{background:var(--ln);color:var(--tx)}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 12px 14px;scrollbar-width:none}.story{flex:none;width:68px;text-align:center;font-size:12px;cursor:pointer}

.story small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.post{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin:0 0 18px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:600}.ph .av{width:34px;height:34px;border:0;font-size:14px;flex:none}.ph time{margin-left:auto;font-weight:400;color:var(--mu);font-size:12px}
.media{position:relative;aspect-ratio:1;background:var(--ln);user-select:none;-webkit-user-select:none}.media img,.prev img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}

.pb{padding:0 12px 12px}.pb p{margin-top:4px}.cm{color:var(--mu);font-size:14px}.add{display:flex;gap:8px;margin-top:10px}.add button{font-weight:600;color:var(--ac)}
.fl{font-size:12px;color:var(--mu)}

.grid button.sel::after{content:"✓";position:absolute;inset:6px 6px auto auto;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center}

.stats{display:flex;gap:20px;text-align:center}.stats b{display:block;font-size:17px}.stats span{color:var(--mu);font-size:13px}.bio{padding:0 14px 16px}
.badge{font:600 11px system-ui;background:var(--ac);color:#3B2418;padding:2px 8px;border-radius:20px}

.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}.ov.sh{align-items:end;padding:0}
.modal{background:var(--sf);border-radius:14px;width:min(460px,100%);max-height:92vh;overflow:auto;padding:16px;display:grid;gap:12px}.modal h2{font-size:17px;display:flex;justify-content:space-between}
.sheet{background:var(--sf);width:min(560px,100%);border-radius:18px 18px 0 0;padding:12px 8px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:4px}
.prev{aspect-ratio:1;border-radius:10px;background:var(--ln);display:grid;place-items:center;color:var(--mu);overflow:hidden;text-align:center;padding:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}.chips button{flex:none;padding:6px 12px;border-radius:20px;background:var(--ln);font-size:13px}.chips button.on{background:var(--ac);color:#3B2418}
.fs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none;min-height:96px}.fs button{flex:none;width:74px;text-align:center;font-size:11px}.fs img{width:74px;height:74px;object-fit:cover;border-radius:8px;border:2px solid transparent;display:block}.fs button.on img{border-color:var(--ac)}.fs small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.sv{position:fixed;inset:0;z-index:60;background:#000;display:grid;place-items:center}.svb{position:relative;width:min(420px,100%);height:100%;max-height:820px;overflow:hidden}.svb>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.svh{position:absolute;top:calc(24px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;align-items:center;gap:10px;color:#fff;z-index:2;font-weight:600}.svh .av{width:32px;height:32px;border:0;font-size:13px}.svh button{margin-left:auto;color:#fff;font-size:28px}
.zone{position:absolute;top:70px;bottom:0;width:40%;z-index:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:80;font-size:14px}
.shd{display:flex;align-items:center;gap:12px;padding:6px 14px 12px}.shd h2{font-size:18px}.rb{width:38px;height:38px;border-radius:50%;background:var(--ln);display:grid;place-items:center;flex:none}.rb svg.i{width:20px;height:20px}
.srow{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;text-align:left}.srow .l{flex:1}.srow .v{color:var(--mu)}.srow svg.i{width:24px;height:24px;flex:none}.srow.st{cursor:default}.sc{font-size:13px;color:var(--mu);padding:18px 14px 4px;font-weight:600}
.tg{width:46px;height:28px;border-radius:14px;background:var(--ln);position:relative;flex:none}.tg i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}.tg.on{background:var(--ac)}.tg.on i{left:21px}
.mini{width:38px;height:38px;flex:none}.mini .av{border:0;font-size:15px}.login .logo{text-align:center}
.scap{position:absolute;left:12px;right:12px;bottom:90px;z-index:2;text-align:center;color:#fff;font-weight:600;font-size:18px;background:rgba(0,0,0,.45);padding:8px 12px;border-radius:10px}.smus{position:absolute;left:12px;top:calc(70px + env(safe-area-inset-top,0px));z-index:2;color:#fff;background:rgba(0,0,0,.45);border-radius:20px;padding:3px 10px;font-size:12px}.react{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;z-index:3}.react button{font-size:26px;background:rgba(0,0,0,.35);border-radius:50%;width:46px;height:46px}
.cmp{position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}.cx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:9;width:44px;height:44px;border-radius:50%;background:rgba(60,60,60,.85);font-size:26px;color:#fff}.mchip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:9;background:rgba(40,40,40,.92);border-radius:16px;padding:8px 14px;font-size:14px;display:flex;gap:8px;max-width:58%;white-space:nowrap}.mchip button{color:#fff}
.stg{position:relative;flex:1;margin:64px 0 8px;border-radius:14px;overflow:hidden;background:#111}.stg>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.dr,.svb>.dr{pointer-events:none}#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:4}
.lay{position:absolute;z-index:3;touch-action:none;cursor:grab}.lx{position:absolute;top:-10px;right:-10px;width:20px;height:20px;border-radius:50%;background:#000;color:#fff;font-size:12px;padding:0}.ccap{position:absolute;left:12px;right:12px;bottom:12px;width:auto;z-index:3;background:rgba(0,0,0,.45);border:0;color:#fff;text-align:center;border-radius:10px}
.tools{position:absolute;right:12px;top:calc(70px + env(safe-area-inset-top,0px));z-index:6;display:grid;gap:10px}.tools button{width:44px;height:44px;border-radius:50%;background:rgba(60,60,60,.85);color:#fff;font-size:18px;border:2px solid transparent}
.bot{display:flex;gap:8px;padding:0 12px 10px;align-items:center}.bot button{flex:1;padding:12px;border-radius:26px;background:#262626;color:#fff;font-weight:600}.bot button.on{outline:2px solid #fff}.bot .go{flex:none;width:52px;height:52px;border-radius:50%;background:#8EC5FF;color:#3B2418;font-size:24px;padding:0}
.rec{margin-top:64px;overflow:auto;flex:1}.rec h3{padding:8px 14px}.shs{position:absolute;left:0;right:0;bottom:0;z-index:8;background:#1c1c1e;border-radius:18px 18px 0 0;padding:14px;max-height:72%;overflow:auto;display:grid;gap:10px}.shs button{color:inherit}.pillb{display:flex;flex-wrap:wrap;gap:8px}.pillb button{background:#fff;color:#111;border-radius:10px;padding:8px 12px;font-weight:600}
.st{display:inline-block;color:#fff;font-weight:700;text-shadow:0 1px 6px #000}.st.tx{font-size:26px}.st.em{font-size:56px}.st.pill,.st.card{background:#fff;color:#111;text-shadow:none;border-radius:10px;padding:6px 12px;font-size:15px}.st.card{display:grid;gap:6px;min-width:150px;border-radius:14px}.st.card b{background:#eee;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}.st.card i{background:#eee;color:#777;padding:6px 10px;border-radius:8px;font-style:normal}.st.card input{width:100%;padding:0}
.vb{width:15px;height:15px;vertical-align:-2px;margin-left:3px;flex:none}
.seal{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;background:linear-gradient(135deg,#3B2418,#6B4430 55%,#8EC5FF);color:#fff;overflow:hidden}.seal .env{font-size:64px}.seal b{font-size:22px;font-variant-numeric:tabular-nums}.seal small{opacity:.75}
.seal.o .env{animation:brk 1.1s ease forwards}.seal.o{animation:flash 1.1s ease forwards}
@keyframes brk{0%{transform:scale(1) rotate(0)}20%{transform:scale(1.2) rotate(-14deg)}40%{transform:scale(1.2) rotate(14deg)}60%{transform:scale(1.3) rotate(-8deg)}100%{transform:scale(2.6);opacity:0}}
@keyframes flash{70%{opacity:1}100%{opacity:0}}
.rvl{animation:rv .7s ease}@keyframes rv{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.gl{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(135deg,#3B2418,#8EC5FF);font-size:30px}
.rpd{color:var(--ac)}[style*="#e0245e"],[style*="#ff5a7a"]{color:var(--tx)!important}[style*="#3ddc84"]{color:var(--ac)!important}
.co{display:flex}.co .av{width:34px;height:34px;border:2px solid var(--sf);font-size:14px;flex:none}.co .av+.av{margin-left:-12px}
.ptabs{display:flex;border-top:1px solid var(--ln)}.ptabs button{flex:1;padding:10px;color:var(--mu);border-top:2px solid transparent;display:grid;place-items:center}.ptabs button.on{color:var(--tx);border-color:var(--tx)}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--ln);border-radius:20px;padding:4px 12px;font-weight:600;font-size:13px}.lnk{font-weight:600;margin-top:4px}
.fby{display:flex;gap:10px;align-items:center;padding:0 14px 12px;font-size:13px}.fby .co .av{width:26px;height:26px;font-size:11px}.pbt .btn{flex:1}
.ov{background:rgba(59,36,24,.65)}.sv,.cmp,.shs,.stg{background:#3B2418;color:#F2E8DA}.cmp{color:#F2E8DA}
.scap,.smus,.ccap,.mchip,.tools button,.cx,.lx,.react button{background:rgba(59,36,24,.75)!important;color:#F2E8DA!important}.mchip button{color:#F2E8DA}
.bars i{background:rgba(242,232,218,.35)}.bars b{background:#F2E8DA}.svh,.svh button,.burst,.seal{color:#F2E8DA}.seal{background:linear-gradient(135deg,#3B2418 30%,#8EC5FF)}
.bot button{background:color-mix(in srgb,#F2E8DA 18%,#3B2418);color:#F2E8DA}.bot button.on{outline-color:#F2E8DA}.tg i{background:#F2E8DA}.grid button.sel::after{color:#3B2418}
.pillb button,.st.pill,.st.card{background:#F2E8DA;color:#3B2418}.st{color:#F2E8DA;text-shadow:0 1px 6px #3B2418}.st.pill,.st.card{text-shadow:none}.st.card b,.st.card i{background:color-mix(in srgb,#3B2418 12%,#F2E8DA);color:#3B2418}
[style*="#aaa"]{color:#F2E8DA!important;opacity:.7}[style*="#222"]{background:color-mix(in srgb,#F2E8DA 18%,#3B2418)!important}
/* aesthetic: brown + beige shades */
body{background:radial-gradient(900px 500px at 50% -8%,color-mix(in srgb,var(--c1) 26%,transparent),transparent),var(--bg)}
header.top{background:color-mix(in srgb,var(--sf) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.logo{background:linear-gradient(45deg,var(--c3),var(--c1) 55%,#8EC5FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.post{border-radius:22px;background:var(--sf);box-shadow:0 10px 28px -14px color-mix(in srgb,#3B2418 55%,transparent)}
.ph{padding:12px 14px}.pb{padding:0 14px 14px}.acts{padding:12px 14px 4px}
.btn{border-radius:999px;padding:9px 18px;box-shadow:0 6px 14px -8px color-mix(in srgb,#3B2418 60%,transparent);transition:transform .15s}.btn:active{transform:scale(.97)}.btn.alt{background:var(--sand);color:var(--tx);box-shadow:none}
input,textarea,select{border-radius:14px;background:color-mix(in srgb,var(--sf) 60%,var(--sand))}
.modal,.sheet{border:1px solid var(--ln);box-shadow:0 24px 60px -24px rgba(59,36,24,.65)}.modal{border-radius:22px}
.ring{background:conic-gradient(from 200deg,var(--c1),var(--c3),#8EC5FF,var(--c1))}.ring.seen{background:var(--ln)}
.chips button,.grid button,.hr{background:var(--sand)}.hr{border-color:var(--c1)}.grid{gap:2px;border-radius:14px;overflow:hidden}
.sc{letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:var(--c2)}
.stats b,main h2,.shd h2{font-family:Georgia,'Times New Roman',serif}
.srow:not(.st):active{background:var(--sand)}.ptabs{border-top-color:var(--c1)}
.toast{border-radius:999px;box-shadow:0 10px 24px -10px rgba(59,36,24,.7)}
.seal,.gl{background:linear-gradient(135deg,#3B2418,#6B4430 50%,#C9A27E)}
::selection{background:#8EC5FF;color:#3B2418}

@media(prefers-reduced-motion:reduce){.burst.go{animation-duration:.01s}}

<body>
<div class="app">
 <header class="top"><span class="logo">Framely</span><div class="row"><button id="theme" class="btn alt" aria-label="Toggle theme">Theme</button><button id="newp" class="btn">New post</button></div></header>
 <nav id="nav"></nav>
 <main id="main"></main>
</div>
<div id="layer"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P={heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z',comment:'M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l1.9-5.6A8.5 8.5 0 1 1 21 11.5z',mark:'M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z',home:'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z',search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-4.3-4.3',user:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',cog:'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4',back:'M15 18l-6-6 6-6',chev:'M9 6l6 6-6 6',lock:'M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4',archive:'M3 4h18v4H3zM5 8v12h14V8M10 12h4',activity:'M3 12h4l3-8 4 16 3-8h4',moon:'M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z',check:'M5 12l5 5 9-10',send:'M22 2L11 13M22 2l-7 20-4-9-9-4z',menu:'M4 8h16M4 15h10',brief:'M3 8h18v12H3zM8 8V5h8v3',repost:'M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3',grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',collab:'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1M17 4a4 4 0 0 1 0 7M22 21v-1a5 5 0 0 0-3-4.5',eye:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z'};
const ic=(n,on)=>`<svg class="i ${on?'on':''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const pal=[['#3B2418','#A67B5B'],['#6B4430','#C9A27E'],['#A67B5B','#EADBC8'],['#C9A27E','#8EC5FF'],['#8EC5FF','#F5EDE0'],['#D9C2A3','#6B4430']];
function art(i,e){const [a,b]=pal[i%6];return 'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${a}'/><stop offset='1' stop-color='${b}'/></linearGradient></defs><rect width='400' height='400' fill='url(#g)'/><circle cx='${100+i*37%200}' cy='${120+i*53%160}' r='${60+i*11%50}' fill='#F2E8DA' fill-opacity='.25'/><circle cx='310' cy='310' r='90' fill='#F2E8DA' fill-opacity='.15'/><text x='200' y='235' font-size='110' text-anchor='middle'>${e}</text></svg>`)}
/* ===== 525 filters: 25 looks x 21 variations ===== */
const A=[['Cinematic','contrast(1.2) saturate(.85) sepia(.15)'],['Vintage','sepia(.5) contrast(.95) brightness(1.05)'],['Noir','grayscale(1) contrast(1.3)'],['Chromatic','saturate(1.6) hue-rotate(15deg)'],['Duotone','grayscale(1) sepia(1) hue-rotate(200deg) saturate(2)'],['Film Grain','contrast(1.1) sepia(.25) saturate(.9)'],['Pastel','saturate(.7) brightness(1.15) contrast(.9)'],['Neon','saturate(2.2) contrast(1.2) hue-rotate(-20deg)'],['Golden','sepia(.4) saturate(1.4) hue-rotate(-10deg)'],['Arctic','saturate(.8) hue-rotate(160deg) brightness(1.1)'],['Teal Orange','contrast(1.15) saturate(1.3) hue-rotate(-12deg)'],['Fade','contrast(.8) brightness(1.15) saturate(.8)'],['Dream','blur(.4px) brightness(1.1) saturate(1.2)'],['Dramatic','contrast(1.5) saturate(.9) brightness(.9)'],['Sunset','sepia(.3) saturate(1.8) hue-rotate(-25deg)'],['Forest','saturate(1.3) hue-rotate(60deg) brightness(.95)'],['Retro','sepia(.7) hue-rotate(-20deg) saturate(1.3)'],['Matte','contrast(.9) saturate(.75) brightness(1.05)'],['Cyber','hue-rotate(250deg) saturate(2) contrast(1.2)'],['Rose','sepia(.3) hue-rotate(300deg) saturate(1.4)'],['Ocean','hue-rotate(180deg) saturate(1.3)'],['Ember','sepia(.6) saturate(2) hue-rotate(-35deg)'],['Mint','hue-rotate(100deg) saturate(1.1) brightness(1.1)'],['Lilac','hue-rotate(270deg) saturate(.9) brightness(1.1)'],['Mono Blue','grayscale(1) sepia(1) hue-rotate(180deg) saturate(3)']];
const B=[['Base',''],['Bright','brightness(1.15)'],['Dark','brightness(.85)'],['Punch','contrast(1.2)'],['Flat','contrast(.85)'],['Vivid','saturate(1.4)'],['Muted','saturate(.6)'],['Warm','sepia(.2)'],['Cool','hue-rotate(20deg)'],['Shift +','hue-rotate(40deg)'],['Shift −','hue-rotate(-40deg)'],['Hazy','brightness(1.1) contrast(.85)'],['Deep','brightness(.9) contrast(1.2)'],['Soft','blur(.5px)'],['Glow','brightness(1.1) saturate(1.2)'],['Mono','grayscale(.6)'],['Sepia','sepia(.35)'],['Ghost','invert(.08)'],['Pink Tint','hue-rotate(320deg)'],['Green Tint','hue-rotate(90deg)'],['Max','contrast(1.15) saturate(1.3) brightness(1.05)']];
const F=[];A.forEach((a,i)=>B.forEach(b=>F.push({i:F.length,c:i,n:a[0]+' · '+b[0],f:(a[1]+' '+b[1]).trim()})));
/* picker: host element, sample image, current filter string, callback */
function picker(host,src,cur,cb){let cat=Math.max(0,F.findIndex(x=>x.f===cur));cat=F[cat]?F[cat].c:0;let q='';
 host.innerHTML=`<div class="row"><input id="fq" type="search" placeholder="Search ${F.length} filters" aria-label="Search filters"><button class="btn alt" data-f="-1">None</button></div><div class="chips" id="fc"></div><div class="fs" id="fl"></div>`;
 const draw=()=>{$('#fc').innerHTML=A.map((a,i)=>`<button data-c="${i}" class="${!q&&i===cat?'on':''}">${a[0]}</button>`).join('');
  const l=q?F.filter(x=>x.n.toLowerCase().includes(q)).slice(0,50):F.filter(x=>x.c===cat);
  $('#fl').innerHTML=l.length?l.map(x=>`<button data-f="${x.i}" class="${x.f===cur?'on':''}"><img src="${src}" alt="" style="filter:${x.f}" loading="lazy"><small>${esc(x.n.split(' · ')[q?0:1]+(q?' · '+x.n.split(' · ')[1]:''))}</small></button>`).join(''):'<p class="cm">No filters match.</p>'};
 draw();$('#fq').oninput=e=>{q=e.target.value.trim().toLowerCase();draw()};
 host.onclick=e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();
  if(b.dataset.c!==undefined){cat=+b.dataset.c;q='';$('#fq').value='';draw()}
  else if(b.dataset.f!==undefined){cur=+b.dataset.f<0?'':F[+b.dataset.f].f;cb(cur);draw()}}}
/* ===== music (synth tracks, no external files) ===== */
const TRACKS=[{n:'Sunset Drive',t:110,w:'triangle',s:[60,64,67,72,67,64,62,65,69,74,69,65]},{n:'Late Night Lo-fi',t:78,w:'sine',s:[57,60,64,60,55,59,62,59,53,57,60,57]},{n:'Neon City',t:128,w:'sawtooth',s:[48,60,48,63,48,65,48,67]},{n:'Morning Coffee',t:96,w:'triangle',s:[67,71,74,71,69,72,76,72]},{n:'Balkan Dance',t:140,w:'square',s:[62,63,66,67,66,63,62,58,62,63,66,67]},{n:'Dream Pop',t:90,w:'sine',s:[64,67,71,76,71,67,65,69,72,77]}];
let AC=null,TM=null;
function stopT(){clearInterval(TM);TM=null}
function playT(i){stopT();const tr=TRACKS[i];if(!tr)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();let k=0;const beat=()=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=tr.w;o.frequency.value=440*Math.pow(2,(tr.s[k%tr.s.length]-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+60/tr.t*.9);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+60/tr.t);k++};beat();TM=setInterval(beat,60000/tr.t)}catch(e){}}
const tags=s=>esc(s).replace(/(?<![&\p{L}\p{N}])([#@])([\p{L}\p{N}_.]*[\p{L}\p{N}_])/gu,(m,c,w)=>c==='#'?`<button data-tag="${w}" style="color:var(--ac)">#${w}</button>`:`<button data-pu="${w}" style="color:var(--ac)">@${w}</button>`);
const musSel=()=>`<select id="ms" aria-label="Music" onchange="playT(this.value)"><option value="">♪ No music</option>${TRACKS.map((t,i)=>`<option value="${i}">♪ ${t.n}</option>`).join('')}</select>`;
/* ===== state ===== */
const h=s=>{let x=5381;for(const c of s)x=(x*33^c.charCodeAt(0))>>>0;return x.toString(36)};
const BASE=['emma.dev','maya.codes','leo.travels','nora.eats','sam.sketch','zoe.moves'];let users=BASE.slice(),ME='';
const hi=u=>[...u].reduce((a,c)=>a+c.charCodeAt(0),0)%6,AVS=[['#3B2418','#F2E8DA'],['#6B4430','#F2E8DA'],['#A67B5B','#FBF6EC'],['#C9A27E','#3B2418'],['#8EC5FF','#3B2418'],['#D9C2A3','#3B2418']],col=u=>AVS[hi(u)][0],now=Date.now();
function seed(){const caps=[['maya.codes','Shipping day ☕ Tiny wins add up.','🚀','contrast(1.2) saturate(.85) sepia(.15) brightness(1.15)'],['leo.travels','Golden hour in the old town.','🌇','sepia(.4) saturate(1.4) hue-rotate(-10deg)'],['nora.eats','Sunday brunch, no regrets.','🥑',''],['sam.sketch','New ink study. Thoughts?','🎨','grayscale(1) contrast(1.3)'],['zoe.moves','Morning run done before sunrise.','🏃',''],['emma.dev','Building something new for the Balkans.','💡','']];
 return {theme:null,session:null,seen:{},accounts:{'emma.dev':{pw:h('Demo@1234'),type:'professional',cat:'Software developer',email:'hello@emma.dev',bio:'Solo dev building AI tools for European teams.',note:'Shipping 🚀'}},posts:caps.map((c,i)=>({id:'s'+i,user:c[0],img:art(i,c[2]),f:c[3],cap:c[1],likes:20+i*17,liked:false,saved:false,ts:now-(i+1)*3.6e6,comments:i%2?[]:[{u:'leo.travels',t:'Love this!'}]}))}}
let S;try{S=JSON.parse(localStorage.getItem('framely')||'null')}catch(e){S=null}if(!S||!S.posts||!S.accounts)S=seed();S=JSON.parse(JSON.stringify(S).split('klea.dev').join('emma.dev').split('tomka').join('peter'));
const save=()=>{try{localStorage.setItem('framely',JSON.stringify(S))}catch(e){toast('Storage is full. Remove a post to save more.')}};
const acc=()=>S.accounts[ME],allU=()=>[...new Set([...BASE,...Object.keys(S.accounts)])];
let view='home',q='',sub='',scol='',ed=false;
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d'};
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const avatar=u=>`<div class="av" style="background:${col(u)};color:${AVS[hi(u)][1]}">${esc(u[0].toUpperCase())}</div>`,layer=x=>{$('#layer').innerHTML=x};
const fname=f=>{const x=F.find(y=>y.f===f);return x?x.n:''};
function likesText(p){const o=p.liked?p.likes-1:p.likes;if(p.liked)return o>0?`Liked by <b>you</b> and <b>${o.toLocaleString()} others</b>`:'Liked by <b>you</b>';return `<b>${p.likes} likes</b>`}
function postHTML(p){return `<article class="post" data-id="${p.id}">${rpl(p)}<div class="ph">${phead(p)}<time>${ago(p.ts)}</time><button data-act="menu" aria-label="More options" style="padding:4px;margin-left:8px">${ic('menu')}</button></div>
${mediaH(p)}
<div class="acts"><button data-act="like" aria-label="Like" class="${p.liked?'liked':''}">${ic('heart',p.liked)}</button><button data-act="focus" aria-label="Comment" class="ab">${ic('comment')}<span class="cc">${p.comments.length}</span></button><button data-act="repost" aria-label="Repost" class="${(p.rp||[]).includes(ME)?'rpd':''}">${ic('repost')}</button><button data-act="share" aria-label="Share">${ic('send')}</button><button data-act="save" class="sp" aria-label="Save">${ic('mark',p.saved)}</button></div>
<div class="pb"><span data-likes>${likesText(p)}</span><p><b>${esc(p.user)}</b>${p.co?' &amp; <b>'+esc(p.co)+'</b>':''} ${isL(p)?'<span class="cm">🔒 Përmbajtja hapet më '+new Date(p.lock).toLocaleString()+'</span>':tags(p.cap)+(p.msg?'<br><i>✉️ '+esc(p.msg)+'</i>':'')}</p>${TRACKS[p.mu]?`<p class="fl"><button data-play="${p.mu}">♪ ${TRACKS[p.mu].n} ▶</button></p>`:''}${fname(p.f)?`<p class="fl">Filter: ${esc(fname(p.f))}</p>`:''}<div class="cl">${p.comments.map(c=>`<p class="cm"><b style="color:var(--tx)">${esc(c.u)}</b> ${esc(c.t)}</p>`).join('')}</div>
<div class="add"><input placeholder="Add a comment…" aria-label="Add a comment" maxlength="200"><button data-act="comment">Post</button></div></div></article>`}
const grid=(l,k='open',sel)=>`<div class="grid">${l.map(p=>`<button data-${k}="${p.id}" class="${sel&&sel.includes(p.id)?'sel':''}" aria-label="Open post">${isL(p)?'<div class="gl">🔒</div>':`<img src="${p.img}" alt="" style="filter:${p.f||'none'}">`}</button>`).join('')}</div>`;
function hlHTML(){const H=acc().highlights||[];return `<div class="hl"><button class="hi" data-newhl><span class="hr d">+</span><small>New</small></button>${H.map((x,i)=>`<button class="hi" data-hl="${i}"><span class="hr"><img src="${x.img}" alt=""></span><small>${esc(x.name)}</small></button>`).join('')}</div>`}
/* ===== render ===== */
function render(){
 if(!ME){loginScreen();return}
 $('#nav').innerHTML=[['home','Home','home'],['explore','Explore','search'],['profile','Profile','user'],['settings','Settings','cog']].map(([v,l,i])=>`<button data-v="${v}" class="${view===v?'act':''}" aria-label="${l}">${ic(i)}<span>${l}</span></button>`).join('');
 const m=$('#main'),a=acc(),vis=S.posts.filter(p=>!p.archived&&!p.hidden);
 if(view==='home'){m.innerHTML=`<div class="col"><div class="stories">${users.map((u,i)=>`<div class="story" data-story="${i}" role="button" tabindex="0"><div class="ring ${S.seen[u]?'seen':''}">${avatar(u)}</div><small>${u===ME?'Your story':esc(u.split('.')[0])}</small></div>`).join('')}</div>${vis.map(postHTML).join('')||'<div class="empty">No posts yet. Tap New post.</div>'}</div>`}
 else if(view==='explore'){const r=S.posts.filter(p=>!p.archived&&(p.user+' '+(isL(p)?'':p.cap+' '+fname(p.f))).toLowerCase().includes(q.toLowerCase()));
  m.innerHTML=`<div class="col w"><div class="pad"><input id="q" type="search" placeholder="Search captions, people or filters" value="${esc(q)}" aria-label="Search"></div>${r.length?grid(r):'<div class="empty">No posts match “'+esc(q)+'”.</div>'}</div>`;
  const qi=$('#q');qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
 else if(view==='settings')settings(m);
 else if(view==='pro')proScreen(m);else profile(m);}
function _o(m,a){{const mine=S.posts.filter(p=>p.user===ME&&!p.archived);
  m.innerHTML=`<div class="col w"><div class="prof"><div class="pav">${a.note?`<button class="note" data-note aria-label="Edit note">${esc(a.note)}</button>`:''}${avatar(ME)}<button class="plus" data-addstory aria-label="Add story">+</button></div><div><h2 style="font-size:20px;margin-bottom:8px">${ME} ${a.type==='professional'?'<span class="badge">Professional</span>':''}</h2><div class="stats"><div><b>${mine.length}</b><span>posts</span></div><div><b>${(1284+mine.length).toLocaleString()}</b><span>followers</span></div><div><b>312</b><span>following</span></div></div></div></div>
  <div class="bio"><p>${esc(a.bio||'')}</p>${a.type==='professional'?`<p class="cm">${esc(a.cat||'')}<br>${esc(a.email||'')}</p>`:''}<div class="row" style="margin-top:10px"><button class="btn alt" data-eb>Edit bio</button><button class="btn alt" data-note>${a.note?'Edit note':'Add note'}</button></div></div>${hlHTML()}${mine.length?grid(mine):'<div class="empty">You haven’t posted yet.</div>'}</div>`}
}
/* ===== settings drawer ===== */
const tog=(on,k)=>`<button class="tg ${on?'on':''}" data-tg="${k}" role="switch" aria-checked="${on}" aria-label="Toggle"><i></i></button>`;
function settings(m){const a=acc(),pro=a.type==='professional',mine=S.posts.filter(p=>p.user===ME&&!p.archived);
 const head=(t,top)=>`<div class="shd"><button class="rb" ${top?'data-v="profile"':'data-s=""'} aria-label="Back">${ic('back')}</button><h2>${t}</h2></div>`;
 const row=(i,l,v,k)=>`<button class="srow" data-s="${k}">${ic(i)}<span class="l">${l}</span><span class="v">${v}</span>${ic('chev')}</button>`;

 const stat=(n,l)=>`<div><b>${n}</b><span>${l}</span></div>`;let o='';a.cols=a.cols||{};
 if(sub==='ac')o=head('Accounts Centre')+'<h3 class="sc">Profiles</h3>'+Object.keys(S.accounts).map(u=>`<div class="srow st"><span class="mini">${avatar(u)}</span><span class="l">${esc(u)}<small class="cm" style="display:block">${S.accounts[u].type==='professional'?'Professional':'Personal'}${u===ME?', signed in':''}</small></span></div>`).join('')+'<h3 class="sc">Password and security</h3><div class="pad" style="display:grid;gap:8px">'+pwf('po','Current password')+pwf('pn','New password (8+, A-Z, 0-9, symbol)')+'<button class="btn" id="pw">Update password</button></div><div class="pad"><button class="btn alt" data-out>Add or switch account</button></div>';
 else if(sub==='saved'){const names=Object.keys(a.cols),sv=S.posts.filter(p=>p.saved&&!p.archived),ids=a.cols[scol]||[],l=scol&&!ed?sv.filter(p=>ids.includes(p.id)):sv;
  o=head('Saved')+`<div class="chips" style="padding:4px 14px"><button data-col="" class="${!scol?'on':''}">All posts</button>${names.map(n=>`<button data-col="${esc(n)}" class="${scol===n?'on':''}">${esc(n)}</button>`).join('')}<button data-newcol>+ Collection</button></div>`+(scol?`<div class="row pad"><button class="btn alt" data-ed>${ed?'Done':'Add or remove posts'}</button><button class="btn alt" data-delcol style="color:#e0245e">Delete</button></div>`:'')+(l.length?grid(l,ed?'tgl':'open',ed?ids:null):'<div class="empty">Nothing here yet. Tap the bookmark on a post to save it.</div>')}
 else if(sub==='archive'){const l=S.posts.filter(p=>p.user===ME&&p.archived);o=head('Archive')+(l.length?grid(l):'<div class="empty">Your archive is empty.</div>')}
 else if(sub==='activity'){const lk=mine.reduce((n,p)=>n+p.likes,0),cr=mine.reduce((n,p)=>n+p.comments.length,0);o=head('Your activity')+'<h3 class="sc">Received</h3><div class="pad"><div class="stats" style="justify-content:space-around">'+stat(mine.length,'posts')+stat(lk,'likes')+stat(cr,'comments')+'</div></div><h3 class="sc">Made</h3><div class="pad"><div class="stats" style="justify-content:space-around">'+stat(S.posts.filter(p=>p.liked).length,'likes')+stat(S.posts.reduce((n,p)=>n+p.comments.filter(c=>c.u===ME).length,0),'comments')+stat(S.posts.filter(p=>p.saved).length,'saved')+'</div></div>'}
 else if(sub==='privacy')o=head('Account privacy')+trow('Private account',!!a.private,'private','Only people you approve can see your posts.')+trow('Hide like counts',!!a.hideLikes,'hideLikes')+trow('Allow comments',a.noCm!==true,'noCm');

 else if(k==='ocf'){if(!ordP)return toast('Zgjidh produktin');ai.orders.unshift({p:ordP,n:$('#on').value||'Klient',t:$('#ot').value||'sa më shpejt',at:Date.now()});save();toast('📩 Porosia u konfirmua; përmbledhja për pronarin u ruajt');ordP='';render()}
 else if(k==='padj'){const f=perf();ai.best={tag:f.tag,hour:f.hour};save();toast('U aplikua ✓');render()}
 else pa(k)}
/* theme + boot */
function applyTheme(){if(S.theme)document.documentElement.dataset.theme=S.theme}
$('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=dark?'light':'dark';applyTheme();save()};
applyTheme();if(S.session&&S.accounts[S.session]){ME=S.session;users=[ME,...allU().filter(x=>x!==ME)]}render();proIntro();
</script>
